name: MacbookDuoApp
options:
  bundleIdPrefix: com.illusionart
  deploymentTarget:
    macOS: "14.0"
settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  MacbookDuoApp:
    type: application
    platform: macOS
    sources:
      - path: MacbookDuoApp/Sources/MacbookDuoApp
    resources:
      - path: MacbookDuoApp/Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.illusionart.MacbookDuoApp
      GENERATE_INFOPLIST_FILE: true
      INFOPLIST_KEY_NSHumanReadableCopyright: ""
      ENABLE_HARDENED_RUNTIME: true
      SWIFT_VERSION: "6.0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
