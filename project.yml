# xcodegen specification for the Mac App Store build of Macbook Duo.
# Regenerate the project with `xcodegen generate` after editing this file.
# The direct-download build still uses SwiftPM (./build.sh); this project
# exists for App Store archives, so it defines the APPSTORE compilation
# condition that strips the self-updater out of the app.
#
# On the store the app is called "Macbook Fold": PRODUCT_NAME below sets the
# bundle name, display name and package name to Macbook Fold while the source,
# module, bundle identifier and this project keep the Macbook Duo name.
name: Macbook Duo

options:
  bundleIdPrefix: com.shivamchopra
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  generateEmptyDirectories: false

# Xcode's "Update to recommended settings" turns user script sandboxing on.
# With it on, the header copy that FoldCore (a static library) performs is
# denied write access to DerivedData and every build fails with
# "Sandbox: ditto ... deny(1) file-write-create .../include/FoldCore/...".
# The project runs no build-phase scripts, so the setting buys nothing here.
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  FoldCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/FoldCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: FoldCore
        SKIP_INSTALL: YES

  MacbookDuo:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacbookDuo
      - path: Resources/MacbookDuoMark.png
      - path: Resources/Assets.xcassets
      - path: ATTRIBUTION.md
        buildPhase: resources
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: FoldCore
      - sdk: Carbon.framework
      - sdk: IOKit.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: ServiceManagement.framework
      - sdk: MetalKit.framework
      - sdk: libz.tbd
    # App/Info.plist and App/MacbookDuo.entitlements are hand-written and
    # referenced through build settings only; the xcodegen `info:` and
    # `entitlements:` keys would regenerate (and overwrite) them.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_NAME: Macbook Fold
        PRODUCT_MODULE_NAME: MacbookDuo
        EXECUTABLE_NAME: MacbookDuo
        PRODUCT_BUNDLE_IDENTIFIER: com.shivamchopra.macbookduo
        MARKETING_VERSION: 1.0.0
        # App Store Connect already holds builds 101 and 102 of 1.0.0; every upload needs a higher number.
        CURRENT_PROJECT_VERSION: 103
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZB6623U832
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: App/MacbookDuo.entitlements
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

schemes:
  Macbook Duo:
    build:
      targets:
        MacbookDuo: all
    run:
      config: Debug
    archive:
      config: Release
