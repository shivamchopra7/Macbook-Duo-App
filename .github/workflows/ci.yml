name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, test and package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package app
        run: ./build.sh

      - name: Package release assets
        run: scripts/package.sh

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
